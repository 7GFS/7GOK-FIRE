enter": "약목", "name": "비룡아파트", "address": "약목면 약목로 95-6"}, {"id": 52, "center": "약목", "name": "동신빌라트", "address": "약목면 복성14길 29-1"}, {"id": 53, "center": "약목", "name": "오성타워맨션", "address": "약목면 복성13길 24"}, {"id": 54, "center": "약목", "name": "우영아파트", "address": "약목면 복성15길 38"}, {"id": 55, "center": "약목", "name": "화성빌라", "address": "약목면 복성3길 6"}, {"id": 56, "center": "약목", "name": "안국아파트", "address": "약목면 동안1길 15"}, {"id": 57, "center": "약목", "name": "성재아파트", "address": "약목면 관호8길 32-2"}, {"id": 58, "center": "약목", "name": "삼주강변타운", "address": "약목면 관호8길 28-18"}];const PASSWORD='119119';const STORE='cg_fdc_map_v1_';const $=id=>document.getElementById(id);let admin=false,active=null,scale=1,tx=0,ty=0,baseW=0,baseH=0;const towns=['왜관읍','북삼읍','석적읍','동명면','가산면','약목면','지천면','기산면'];const townOf=a=>towns.find(t=>a.address.includes(t))||'기타';const centerName=c=>c.endsWith('119안전센터')?c:c+'119안전센터';const hasMap=a=>!!localStorage.getItem(STORE+a.id);function init(){towns.forEach(t=>$('town').add(new Option(t,t)));[...new Set(apartments.map(a=>a.center))].sort().forEach(c=>$('center').add(new Option(centerName(c),c)));render()}function render(){let q=$('q').value.trim().toLowerCase(),t=$('town').value,c=$('center').value;let result=apartments.filter(a=>(!t||townOf(a)===t)&&(!c||a.center===c)&&(!q||(a.name+' '+a.address+' '+centerName(a.center)).toLowerCase().includes(q)));$('count').textContent=result.length+'개 단지 검색됨';$('registered').textContent='위치도 등록 '+apartments.filter(hasMap).length+'/'+apartments.length+'개';$('list').replaceChildren();if(!result.length){$('list').innerHTML='<div class="glass p-8 rounded-xl text-center muted">검색 결과가 없습니다.</div>';return}result.forEach(a=>{let b=document.createElement('button');b.className='glass rounded-2xl p-4 text-left w-full flex items-center gap-3 active:bg-slate-700';let left=document.createElement('div');left.className='flex-1 min-w-0';let name=document.createElement('div');name.className='font-bold text-lg';name.textContent=a.name;let addr=document.createElement('div');addr.className='muted text-sm mt-1';addr.textContent=a.address;let tag=document.createElement('div');tag.className='text-xs text-sky-300 mt-2';tag.textContent=centerName(a.center)+' · '+townOf(a);left.append(name,addr,tag);let status=document.createElement('span');status.className='chip shrink-0 '+(hasMap(a)?'bg-emerald-900 text-emerald-200':'bg-slate-700 text-slate-200');status.textContent=hasMap(a)?'도면 있음':'미등록';b.append(left,status);b.onclick=()=>openMap(a);$('list').append(b)})}function updateTransform(){if(!baseW)return;$('mapImage').style.width=baseW+'px';$('mapImage').style.height=baseH+'px';$('mapImage').style.transform=`translate(calc(-50% + ${tx}px),calc(-50% + ${ty}px)) scale(${scale})`}function reset(){if(!$('mapImage').naturalWidth)return;let v=$('viewer'),w=$('mapImage').naturalWidth,h=$('mapImage').naturalHeight,f=Math.min(v.clientWidth/w,v.clientHeight/h);baseW=w*f;baseH=h*f;scale=1;tx=ty=0;updateTransform()}function zoom(f){scale=Math.min(10,Math.max(.5,scale*f));updateTransform()}function openMap(a){active=a;$('mName').textContent=a.name;$('mAddress').textContent=a.address;$('modal').classList.remove('hide');$('upload').classList.toggle('hide',!admin);$('remove').classList.toggle('hide',!admin||!hasMap(a));let data=localStorage.getItem(STORE+a.id);$('mapImage').classList.toggle('hide',!data);$('empty').classList.toggle('hide',!!data);if(data){$('mapImage').onload=reset;$('mapImage').src=data}else{$('mapImage').removeAttribute('src');baseW=0}}function closeMap(){$('modal').classList.add('hide');active=null;render()}$('close').onclick=closeMap;$('plus').onclick=()=>zoom(1.3);$('minus').onclick=()=>zoom(1/1.3);$('reset').onclick=reset;$('viewer').addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?1.15:1/1.15)},{passive:false});const pointers=new Map();let previous=null;$('viewer').addEventListener('pointerdown',e=>{if(!baseW)return;e.currentTarget.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});previous=null});$('viewer').addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});let arr=[...pointers.values()];let center={x:arr.reduce((s,p)=>s+p.x,0)/arr.length,y:arr.reduce((s,p)=>s+p.y,0)/arr.length};let dist=arr.length>=2?Math.hypot(arr[0].x-arr[1].x,arr[0].y-arr[1].y):null;if(previous&&previous.n===arr.length){tx+=center.x-previous.x;ty+=center.y-previous.y;if(dist&&previous.dist)scale=Math.max(.5,Math.min(10,scale*dist/previous.dist));updateTransform()}previous={...center,dist,n:arr.length}});function endPointer(e){pointers.delete(e.pointerId);previous=null}['pointerup','pointercancel','lostpointercapture'].forEach(k=>$('viewer').addEventListener(k,endPointer));$('upload').onclick=()=>$('file').click();$('file').onchange=async e=>{let f=e.target.files[0];if(!f||!active)return;if(!['image/png','image/jpeg'].includes(f.type)){alert('JPG 또는 PNG 파일만 등록할 수 있습니다.');return}if(f.size>3*1024*1024){alert('저장 공간 제한을 고려하여 3MB 이하 이미지를 사용하세요.');return}let reader=new FileReader();reader.onload=()=>{try{localStorage.setItem(STORE+active.id,reader.result);openMap(active);render()}catch(err){alert('브라우저 저장 공간이 부족합니다. 이미지 용량을 줄이거나 서버 저장 방식으로 전환하세요.')}};reader.readAsDataURL(f);e.target.value=''};$('remove').onclick=()=>{if(active&&confirm(active.name+' 위치도를 삭제하시겠습니까?')){localStorage.removeItem(STORE+active.id);openMap(active);render()}};$('adminBtn').onclick=()=>{if(admin){admin=false;$('adminBtn').textContent='관리자';if(active)openMap(active);return}$('auth').classList.remove('hide');$('pin').value='';$('pin').focus()};$('cancelAuth').onclick=()=>$('auth').classList.add('hide');$('confirmAuth').onclick=()=>{if($('pin').value!==PASSWORD){alert('비밀번호가 일치하지 않습니다.');return}admin=true;$('auth').classList.add('hide');$('adminBtn').textContent='관리 종료';if(active)openMap(active)};$('pin').addEventListener('keydown',e=>{if(e.key==='Enter')$('confirmAuth').click()});['q','town','center'].forEach
